name: Deploy website to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Generate static resume update date
        run: python3 scripts/update_resume_date.py

      - name: Test resume date generation
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Check local website links
        run: python3 scripts/check_local_links.py

      - name: Check JavaScript syntax
        run: |
          for script in static-html/js/*.js; do
            node --check "$script"
          done

      - name: Upload website files only
        uses: actions/upload-pages-artifact@v3
        with:
          path: static-html

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: validate-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
